    "language": "verilog",
    "top": "fcapz_axi_mon",
    "sources": [
      "../../rtl/dpram.v",
      "../../rtl/trig_compare.v",
      "../../rtl/fcapz_ela.v",
      "../../rtl/fcapz_axi_mon.v"
    ]
  },
  "candidate": {
