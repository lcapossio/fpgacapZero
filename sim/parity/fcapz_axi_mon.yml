{
  "version": 1,
  "name": "fcapz_axi_mon_parity",
  "description": "Verilog/VHDL parity for the passive AXI4-Lite monitor. Layer-0 interface parity is enforced here; behavioral parity is enforced by the shared cocotb bench run against both languages (sim/run_cocotb_axi_mon.py --hdl verilog|vhdl). The full formal equivalence proof is deferred: this is the only core with an active-low top-level reset (ARESETN, inverted to the ELA's sample_rst internally), which the formal miter's active-high reset sequencing cannot drive -- so the embedded ELA's sample domain never resets in the miter, leaving spurious unproven points. The embedded fcapz_ela is proven separately (fcapz_ela.yml).",
