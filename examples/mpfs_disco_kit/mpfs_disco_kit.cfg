#
# OpenOCD config for the PolarFire SoC Discovery Kit's on-board (embedded)
# FlashPro5.  Declares the FPGA TAP only: no RISC-V target, so OpenOCD never
# scans the MSS debug IRs, and the fcapz USER1/USER2 IRs (0x20/0x21) are left
# to the host.  The OpenOCD TCL server listens on the default port 6666.
#
# Needs an OpenOCD with interface/microchip/embedded_flashpro5.cfg (0.12+).
# The ftdi driver must be able to open FT4232H channel A: on Linux that works
# as shipped; on Windows Microchip's FlashPro driver owns the channel.

source [find interface/microchip/embedded_flashpro5.cfg]
transport select jtag
adapter speed 6000
reset_config trst_only

jtag newtap MPFS095T tap -irlen 8 -expected-id 0x0f8181cf -ignore-version

gdb_port disabled
telnet_port disabled
init
