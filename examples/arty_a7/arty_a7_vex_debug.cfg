# OpenOCD config for VexRiscv CPU debug on the Arty A7-100T -- the
# arty_a7_vex_debug_top.bit build (DEBUG_EN=1). It attaches an upstream RISC-V
# target to the standard Debug Module / JTAG DTM that the design tunnels
# through a Xilinx BSCANE2 on USER3, so GDB can halt/step/inspect the CPU while
# the fcapz cores keep serving USER1/2/4 on the same cable.
#
# Requires a recent UPSTREAM OpenOCD (riscv-openocd / xpack); older distro
# builds lack `riscv set_bscan_tunnel_ir`. Bring up the board first
# (program arty_a7_vex_debug_top.bit), then:
#
#   openocd -f examples/arty_a7/arty_a7_vex_debug.cfg
#   riscv64-unknown-elf-gdb -x examples/arty_a7/arty_a7_vex_debug.gdb
#
# One OpenOCD process serves BOTH this riscv target (GDB :3333) and fcapz's raw
# irscan/drscan over the Tcl port (:6666). They share the single TAP, so
# serialize: `poll off` before driving the fcapz cores, `poll on` after (or
# issue the fcapz op as one compound Tcl request). Do NOT run Xilinx hw_server
# on the same cable at the same time.

# ---- Adapter: Arty A7 onboard FT2232 USB-JTAG (as in arty_a7.cfg) ----
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0088 0x008b
ftdi layout_signal nTRST -data 0x0010 -noe 0x0010
ftdi layout_signal nSRST -data 0x0020 -noe 0x0020

transport select jtag
# Debug over the tunnel is more timing-sensitive than raw scans; start slow.
adapter speed 500

set _CHIPNAME xc7a100t
set _IDCODE 0x13631093

# Single physical TAP (the FPGA), IR length 6 -- same TAP the fcapz cores use.
jtag newtap $_CHIPNAME tap -irlen 6 -expected-id $_IDCODE

# ---- RISC-V target over the USER3 BSCAN tunnel ----
target create $_CHIPNAME.cpu riscv -chain-position $_CHIPNAME.tap

# USER3 = IR 0x22 on xc7a100t. OpenOCD's tunnel defaults to USER4 (0x23),
# which fcapz's EJTAG-AXI bridge owns, so point it at USER3 explicitly.
riscv set_bscan_tunnel_ir 0x22
# Tunnelled DMI: 6-bit tunnelled IR, SiFive/Xilinx BSCAN tunnel type.
riscv use_bscan_tunnel 6 1

init

# Halted memory access via the program buffer (the DM has progBufSize=2); the
# CPU has no dedicated system-bus access unit in this config.
riscv set_mem_access progbuf

echo "fcapz: VexRiscv debug target ready (gdb :3333, tcl :6666)"
